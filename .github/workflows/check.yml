name: check

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Syntax of scripts by shebang
        run: |
          status=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            first="$(head -n1 "$f")"
            case "$first" in
              '#!'*python3*) python3 -m py_compile "$f" || status=1 ;;
              '#!'*bash*|'#!'*sh) bash -n "$f" || status=1 ;;
            esac
          done < <(git ls-files -z bin system)
          while IFS= read -r -d '' f; do
            fish -n "$f" || status=1
          done < <(git ls-files -z '*.fish')
          exit $status

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix flake check (builds every home configuration)
        run: nix flake check --print-build-logs
