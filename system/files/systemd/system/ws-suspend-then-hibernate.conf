# GNOME's Suspend (gnome-session calls logind SuspendWithFlags) and
# `systemctl suspend` become suspend-then-hibernate: S3, then hibernation
# after HibernateDelaySec (sleep.conf.d/85-ws-hibernate-delay.conf). Hooks
# see suspend-then-hibernate, SYSTEMD_SLEEP_ACTION tells the step. Sessions
# stay unfrozen as for the other hibernating services (ws-t2-nofreeze.conf).
# helpws suspend, Hibernate.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-sleep suspend-then-hibernate
Environment=SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=0
