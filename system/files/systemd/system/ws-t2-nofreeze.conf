# Hibernation (helpws suspend, Hibernate): the sleep hook 60-ws-t2-hibernate
# unbinds the T2 audio function, which waits until PipeWire closes the
# sound card. systemd-sleep freezes user.slice before its hooks; PipeWire
# then never closes it and the hibernation hangs. Sessions stay unfrozen
# (the kernel still freezes all tasks for the image).
[Service]
Environment=SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=0
