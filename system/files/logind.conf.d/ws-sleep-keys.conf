# Lid: suspend-then-hibernate, on battery and on AC power (docked: the
# default, ignore). Power key: hibernate where no GNOME session takes the
# key (a text console); a GNOME session handles it itself (gsd-media-keys,
# power-button-action = hibernate in gnome/gnome.nix). helpws suspend,
# Hibernate.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
HandlePowerKey=hibernate
