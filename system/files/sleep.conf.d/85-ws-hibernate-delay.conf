# suspend-then-hibernate (lid, GNOME Suspend; helpws suspend, Hibernate):
# S3 for 24 h, then the RTC wakes the machine and it hibernates.
# SuspendEstimationSec: systemd measures the battery drain only once, at
# that wake (default: an extra wake every hour while the drain is unknown).
# Not configurable in systemd 259: on battery, once the measured drain says
# the charge reaches ~5% before the 24 h are up, systemd wakes earlier and
# hibernates then.
[Sleep]
HibernateDelaySec=24h
SuspendEstimationSec=24h
