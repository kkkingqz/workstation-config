[ubuntu]
image=docker.io/library/ubuntu:26.04
home="${HOME}/.local/share/distrobox-homes/ubuntu"
init=false
nvidia=false
pull=true
root=false
start_now=false
entry=false

# Arch is rolling: pinned by digest (archlinux:latest of 2026-09-21).
# Update: new digest here, then `wsbox recreate arch` (docs/workstation.md).
[arch]
image=docker.io/library/archlinux@sha256:917e543c9d0f1f495d70907bdf05bf53607e791b351e1b01ccd3aec2442303ed
home="${HOME}/.local/share/distrobox-homes/arch"
init=false
nvidia=false
pull=true
root=false
start_now=false
entry=false

[wine]
image=docker.io/library/ubuntu:26.04
home="${HOME}/.local/share/distrobox-homes/wine"
init=false
nvidia=false
pull=true
root=false
start_now=false
entry=false

# Build containers share the host HOME: sources live in ~ (e.g. ~/touchbar).
# t2bce modules themselves are built by ws-suspend in a one-off container.
[t2bce-build]
image=docker.io/library/ubuntu:26.04
home="${HOME}"
init=false
nvidia=false
pull=true
root=false
start_now=false
entry=false
additional_packages="build-essential bison flex kmod libelf-dev libssl-dev"

# Touch Bar port (~/touchbar). Rust is installed by hand with rustup into
# /opt/rust (owned by the user), used with
# RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo.
[touchbar-build]
image=docker.io/library/ubuntu:26.04
home="${HOME}"
init=false
nvidia=false
pull=true
root=false
start_now=false
entry=false
additional_packages="build-essential git pkg-config libdrm-dev libegl-dev libgles-dev libinput-dev libsystemd-dev libudev-dev libwayland-dev ripgrep shellcheck systemd"
