# GNOME workstation managed appearance profile.
# Format: GSETTINGS_SCHEMA|KEY|GVARIANT_VALUE
#
# Scope is deliberately narrow. This file must NOT manage:
# - display scale / monitors.xml;
# - org.gnome.mutter experimental-features;
# - input sources / keyboard shortcuts;
# - enabled GNOME extensions;
# - Flatpak / Distrobox / Wine application settings;
# - wallpaper (left as a user choice for now).

# Core GNOME / GTK appearance
org.gnome.desktop.interface|color-scheme|'prefer-dark'
org.gnome.desktop.interface|accent-color|'orange'
org.gnome.desktop.interface|gtk-theme|'Yaru-dark'
org.gnome.desktop.interface|icon-theme|'Yaru-dark'
org.gnome.desktop.interface|cursor-theme|'Yaru'
org.gnome.desktop.interface|font-name|'Ubuntu Sans 11'
org.gnome.desktop.interface|document-font-name|'Sans 11'
org.gnome.desktop.interface|monospace-font-name|'Ubuntu Sans Mono 11'

# Ubuntu Dock: current working baseline captured 2026-09-23
org.gnome.shell.extensions.dash-to-dock|dock-position|'BOTTOM'
org.gnome.shell.extensions.dash-to-dock|dock-fixed|true
org.gnome.shell.extensions.dash-to-dock|autohide|true
org.gnome.shell.extensions.dash-to-dock|intellihide|true
org.gnome.shell.extensions.dash-to-dock|dash-max-icon-size|50
org.gnome.shell.extensions.dash-to-dock|show-show-apps-button|true
org.gnome.shell.extensions.dash-to-dock|show-favorites|true
org.gnome.shell.extensions.dash-to-dock|show-running|true
org.gnome.shell.extensions.dash-to-dock|show-trash|false
org.gnome.shell.extensions.dash-to-dock|show-mounts|true
org.gnome.shell.extensions.dash-to-dock|multi-monitor|true
org.gnome.shell.extensions.dash-to-dock|click-action|'focus-minimize-or-appspread'
