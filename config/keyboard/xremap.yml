# =============================================================================
# Workstation macOS-style keyboard layer
# =============================================================================
#
# Semantic modifier model:
#
#   Apple keyboard       PC / Windows keyboard       Linux
#   Command              Win                         Super
#   Option               Alt                         Alt
#   Control              Ctrl                        Ctrl
#
# Do NOT globally swap Ctrl/Super. Ctrl must remain Ctrl for terminals/TUI apps.
#
# GNOME owns system shortcuts. xremap translates application shortcuts and
# converts physical Ctrl+Left/Right into private GNOME workspace chords.
#
# GNOME Wayland application filtering requires the xremap GNOME extension.
# ws-xremap refuses to start without its D-Bus bridge, so terminal exclusions
# can never silently stop working.

modmap:
  - name: Apple Fn mode
    device:
      only:
        - ids:0x05ac:0
    remap:
      Fn:
        skip_key_event: false
        press: { set_mode: apple_fn }
        release: { set_mode: default }


keymap:
  - name: macOS tiling on Apple keyboards
    exact_match: true
    mode: apple_fn
    device:
      only:
        - ids:0x05ac:0
    remap:
      Ctrl-Home: Shift-Ctrl-Alt-Super-Left
      Ctrl-End: Shift-Ctrl-Alt-Super-Right
      Ctrl-PageUp: Shift-Ctrl-Alt-Super-Up
      Ctrl-PageDown: Shift-Ctrl-Alt-Super-Down

      Ctrl-F: Shift-Ctrl-Alt-Super-F
      Ctrl-C: Shift-Ctrl-Alt-Super-C
      Ctrl-R: Shift-Ctrl-Alt-Super-R

  - name: macOS Spaces
    exact_match: true
    remap:
      Ctrl-Left: Ctrl-Alt-Super-Left
      Ctrl-Right: Ctrl-Alt-Super-Right

  # Terminal-specific macOS navigation.
  # GNOME normally consumes Super+Left/Right for window tiling. xremap sees
  # the physical event first and converts it before Mutter receives it.
  - name: macOS app/window actions
    exact_match: true
    remap:
      Alt-Super-Esc: { launch: ["ws-window", "task-manager"] }
      Super-H: { launch: ["ws-window", "hide-current"] }
      Alt-Super-H: { launch: ["ws-window", "hide-others"] }
      Alt-Super-W: { launch: ["ws-window", "close-current"] }
      Alt-Super-M: { launch: ["ws-window", "minimize-current"] }
      Super-Shift-Q: { launch: ["ws-window", "logout"] }
      Alt-Super-Shift-Q: { launch: ["ws-window", "logout-now"] }

  - name: macOS tiling on PC keyboards
    exact_match: true
    device:
      not:
        - ids:0x05ac:0
    remap:
      Ctrl-Super-Left: Shift-Ctrl-Alt-Super-Left
      Ctrl-Super-Right: Shift-Ctrl-Alt-Super-Right
      Ctrl-Super-Up: Shift-Ctrl-Alt-Super-Up
      Ctrl-Super-Down: Shift-Ctrl-Alt-Super-Down

  - name: macOS terminal shortcuts
    exact_match: true
    application:
      only:
        - '/.*[Gg]hostty.*/'
        - '/.*[Ww]ave.*/'
        - '/.*[Tt]erminal.*/'
        - '/.*[Pp]tyxis.*/'
        - '/.*[Kk]itty.*/'
        - '/.*[Aa]lacritty.*/'
    remap:
      Super-Left: Ctrl-A
      Super-Right: Ctrl-E
      Super-Backspace: Ctrl-U
      Alt-Left: Alt-B
      Alt-Right: Alt-F

  - name: macOS Nautilus / Finder shortcuts
    exact_match: true
    application:
      only:
        - '/.*[Nn]autilus.*/'
    remap:
      # Finder view modes
      # Finder Command+1 = Icons; Nautilus Ctrl+2 = Grid
      Super-1: Ctrl-2
      # Finder Command+2 = List; Nautilus Ctrl+1 = List
      Super-2: Ctrl-1

      # Finder Go locations
      Super-Shift-H: Alt-Home
      Super-Shift-C:
        - Ctrl-L
        - { launch: ["ws-nautilus-current", "computer"] }
        - { sleep: 300 }
        - Enter
      Super-Shift-O:
        - Ctrl-L
        - { launch: ["ws-nautilus-current", "documents"] }
        - { sleep: 300 }
        - Enter
      Super-Shift-D:
        - Ctrl-L
        - { launch: ["ws-nautilus-current", "desktop"] }
        - { sleep: 300 }
        - Enter
      Super-Up: Alt-Up
      Super-Down: Enter
      Super-LeftBrace: Back
      Super-RightBrace: Forward

      # Finder file actions
      Super-I: Alt-Enter
      Super-Backspace: Delete
      Super-Delete: Delete
      Super-Shift-N: Ctrl-Shift-N

      # Finder "Go to Folder" / "Connect to Server".
      # Nautilus uses the location entry for both local paths and URIs
      # such as smb:// and sftp://.
      Super-Shift-G: Ctrl-L
      Super-K: { launch: ["nautilus", "x-network-view:///"] }

      # Finder hidden-files toggle
      Super-Shift-Dot: Ctrl-H

  - name: macOS GUI shortcuts
    exact_match: true
    application:
      not:
        - '/.*[Gg]hostty.*/'
        - '/.*[Ww]ave.*/'
        - '/.*[Tt]erminal.*/'
        - '/.*[Pp]tyxis.*/'
        - '/.*[Kk]itty.*/'
        - '/.*[Aa]lacritty.*/'
    remap:
      # Editing
      Super-C: Ctrl-C
      Super-V: Ctrl-V
      Super-X: Ctrl-X
      Super-A: Ctrl-A
      Super-Z: Ctrl-Z
      Super-Shift-Z: Ctrl-Shift-Z

      # Documents / application
      Super-S: Ctrl-S
      Super-O: Ctrl-O
      Super-P: Ctrl-P
      Super-F: Ctrl-F
      Super-N: Ctrl-N
      Super-T: Ctrl-T
      Super-W: Ctrl-W
      Super-Q: Ctrl-Q
      Super-Comma: Ctrl-Comma

      # macOS line/document navigation
      Super-Left: Home
      Super-Right: End
      Super-Up: Ctrl-Home
      Super-Down: Ctrl-End
      Super-Shift-Left: Shift-Home
      Super-Shift-Right: Shift-End
      Super-Shift-Up: Ctrl-Shift-Home
      Super-Shift-Down: Ctrl-Shift-End

      # macOS Option word navigation
      Alt-Left: Ctrl-Left
      Alt-Right: Ctrl-Right
      Alt-Shift-Left: Ctrl-Shift-Left
      Alt-Shift-Right: Ctrl-Shift-Right
      Alt-Backspace: Ctrl-Backspace
