# Workstation keyboard profile
#
# Modifier semantics are intentionally identical on Apple and PC keyboards:
#   Apple Command / PC Win -> Super
#   Apple Option  / PC Alt -> Alt
#   Apple Control / PC Ctrl -> Ctrl

PROFILE=macos
PC_MODIFIER_LAYOUT=semantic
XREMAP_DESKTOP=gnome
XREMAP_WATCH=config,device
GNOME_XREMAP_EXTENSION_UUID=xremap@k0kubun.com
